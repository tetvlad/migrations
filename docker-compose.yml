version: '3.8'

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: jdbc-mssql
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=QwerTy!Pass123
      - MSSQL_PID=Developer
    ports:
      - "1435:1433"
    volumes:
      - mssql-data:/var/opt/mssql

volumes:
  mssql-data: